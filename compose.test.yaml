name: botanica-checks
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: ephemeral-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20
  test:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: build
    environment:
      TEST_DATABASE_URL: postgres://acceptance:ephemeral-test-only@db:5432/acceptance
    command:
      [
        "npx",
        "vitest",
        "run",
        "apps/server/src/persistence.integration.test.ts",
        "apps/server/src/game.integration.test.ts",
      ]
    depends_on:
      db:
        condition: service_healthy
